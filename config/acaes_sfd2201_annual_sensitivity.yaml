simulation:
  id: acaes_sfd2201_annual_sensitivity
  system_file: systems/acaes_salt.yaml
  cost_case_file: cost_cases/acaes_salt_central.yaml

data:
  start_month: "2024-12"
  end_month: "2025-11"
  node: SFD2201
  island: NI
  raw_data_dir: data/raw

finance:
  # Pre-tax, ungeared, real-NZD screening model. No tax, financing or residual value.
  project_life_years: 40
  real_discount_rate: 0.08
  annual_variable_margin_fade: 0.005
  annualisation_factor: 1
  augmentation: []

solver:
  time_limit_seconds: 900
  mip_relative_gap: 0.0001

reporting:
  output_dir: outputs/acaes_salt

sensitivity:
  duration_hours: [8, 10, 12]
  cost_case_files:
    - cost_cases/acaes_salt_low.yaml
    - cost_cases/acaes_salt_central.yaml
    - cost_cases/acaes_salt_high.yaml
