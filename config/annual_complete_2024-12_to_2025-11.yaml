simulation:
  id: bess_sfd2201_annual_complete_2024_12_to_2025_11
  system_file: systems/bess_huntly_like.yaml
  cost_case_file: cost_cases/bess_huntly_like_base.yaml

# Latest continuous 12-month historic window with complete EA monthly final-price files.
data:
  start_month: "2024-12"
  end_month: "2025-11"
  node: "SFD2201"
  island: "NI"
  raw_data_dir: "data/raw"

finance:
  # The model period is a full historic year, so do not multiply it further.
  project_life_years: 20
  real_discount_rate: 0.08
  annual_variable_margin_fade: 0.015
  annualisation_factor: 1
  augmentation:
    []

solver:
  # One continuous 12-month MILP, retaining inter-month state of charge.
  time_limit_seconds: 900
  mip_relative_gap: 0.0001

reporting:
  output_dir: "outputs"
